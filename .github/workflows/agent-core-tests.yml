name: Agent Core Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "server/agent-core.js"
      - "server/agent-core.test.js"
      - "server/package.json"
      - ".github/workflows/agent-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run agent core tests
        run: node --test agent-core.test.js
