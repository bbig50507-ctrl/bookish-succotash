var id=Date.now(),o={id:id,t:$("n_type").value,c:$("n_city").value,p:p,r:5,sea:0,n:{ar:nm,fr:nm}};if(SB){if(!ME){authOpen();return}SB.from("listings").insert({type:o.t,city:o.c,price:p,rating:5,sea:false,name:nm}).then(function(r){if(r.error)alert(T[lang].err);else loadAll()})}else{o.mine=1;L.push(o);save()}$("n_name").value="";$("n_price").value="";render()};
$("mic").onclick=function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert(T[lang].nov);return}
var r=new SR();r.lang=lang=="ar"?"ar-DZ":"fr-FR";var b=$("mic");b.classList.add("on");
r.onresult=function(e){$("q").value=e.results[0][0].transcript;smart()};r.onend=function(){b.classList.remove("on")};r.onerror=function(){b.classList.remove("on")};
try{r.start()}catch(x){b.classList.remove("on")}};
var BASE=L.filter(function(x){return !x.mine});
$("role").onclick=function(){ROLE=ROLE=="host"?"guest":"host";setAcct();if(SB&&ME)SB.from("profiles").update({role:ROLE}).eq("id",ME)};
ui();
function authOpen(){$("a_msg").textContent="";$("adlg").showModal()}
$("acct").onclick=function(){if(!SB)return;if(ME)SB.auth.signOut();else authOpen()};
$("a_x").onclick=function(){$("adlg").close()};
function authDo(up){var e=$("a_e").value.trim(),p=$("a_pw").value;if(!e||!p)return;var c=up?SB.auth.signUp({email:e,password:p}):SB.auth.signInWithPassword({email:e,password:p});
c.then(function(r){if(r.error)$("a_msg").textContent=r.error.message;else if(up&&!r.data.session)$("a_msg").textContent=T[lang].a_chk;else $("adlg").close()})}
$("a_in").onclick=function(){authDo(false)};$("a_up").onclick=function(){authDo(true)};
async function loadAll(){if(!SB)return;
var l=await SB.from("listings").select("*");
if(!l.error)L=BASE.concat(l.data.map(function(x){return{id:x.id,t:x.type,c:x.city,p:+x.price,r:+x.rating,sea:x.sea?1:0,n:{ar:x.name,fr:x.name},owner:x.owner}}));
var a=await SB.from("availability").select("*");
if(!a.error)bookings=a.data.map(function(x){return{id:x.listing_id,a:x.check_in,z:x.check_out,fee:0}});
myb=[];if(ME){var m=await SB.from("bookings").select("fee");if(!m.error)myb=m.data.map(function(x){return{fee:+x.fee}})}
render()}
if(window.supabase&&SB_URL.indexOf("http")==0){SB=supabase.createClient(SB_URL,SB_KEY);
SB.auth.onAuthStateChange(function(ev,ses){ME=ses?ses.user.id:null;ROLE="guest";
(ME?SB.from("profiles").select("role").eq("id",ME).maybeSingle():Promise.resolve({})).then(function(p){if(p.data&&p.data.role)ROLE=p.data.role;setAcct();loadAll()})});
setInterval(loadAll,30000)}
</script>
</body>
